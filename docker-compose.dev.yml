---
name: attu-dev
networks:
    attu:
        attachable: true
        name: attu_dev
services:
    database:
        cap_add:
            - SYS_NICE
        env_file:
            - .env
        environment:
            - MARIADB_DATABASE=attu_wiki
            - MARIADB_PASSWORD=${ATTU_DB_PASSWORD}
            - MARIADB_RANDOM_ROOT_PASSWORD=true
            - MARIADB_USER=attu
        healthcheck:
            interval: 10s
            retries: 10
            start_period: 5s
            test: [ "CMD", "healthcheck.sh", "--connect", "--innodb_initialized" ]
            timeout: 3s
        image: mariadb:12
        logging:
            driver: journald
        mem_limit: 2048m
        networks:
            - attu
        restart: always
        volumes:
            - ./attu-wiki-backup.sql:/docker-entrypoint-initdb.d/init.sql
    job-update:
        build:
            args:
                - BUILD_TYPE=dev
            context: .
            dockerfile: ./mediawiki.Dockerfile
            target: scheduler
        depends_on:
            database:
                condition: service_healthy
            redis:
                condition: service_healthy
        env_file:
            - .env
        environment:
            - BUILD_TYPE=dev
            - RUNNER_TYPE=update
        logging:
            driver: journald
        networks:
            - attu
        restart: 'no'
        volumes:
            - ./devel/NovaDiscord:/app/mediawiki/extensions/NovaDiscord:ro
            - ./files/listed_ip_30_all.txt:/app/mediawiki/resources/listed_ip_30_all.txt
            - ./images:/app/mediawiki/images
            - ./sitemap:/app/mediawiki/sitemap
    mediawiki:
        build:
            args:
                - BUILD_TYPE=dev
            context: .
            dockerfile: ./mediawiki.Dockerfile
            target: mediawiki
        depends_on:
            job-update:
                condition: service_completed_successfully
        env_file:
            - .env
        environment:
            - BUILD_TYPE=dev
        healthcheck:
            interval: 30s
            retries: 3
            start_period: 15s
            test: [ "CMD", "curl", "-fsS", "http://localhost:8080/wiki/Main_Page" ]
            timeout: 5s
        logging:
            driver: journald
        mem_limit: 2048m
        networks:
            - attu
        ports:
            - 127.0.0.1:6008:8080
        restart: always
        volumes_from:
            - job-update
    redis:
        command: [ "redis-server", "--loglevel", "warning" ]
        healthcheck:
            interval: 5s
            retries: 5
            start_period: 5s
            test: [ "CMD", "redis-cli", "ping" ]
            timeout: 3s
        image: redis:8
        logging:
            driver: journald
        mem_limit: 1024m
        networks:
            - attu
        restart: always
    scheduler:
        build:
            args:
                - BUILD_TYPE=dev
            context: .
            dockerfile: ./mediawiki.Dockerfile
            target: scheduler
        depends_on:
            job-update:
                condition: service_completed_successfully
        env_file:
            - .env
        environment:
            - BUILD_TYPE=dev
            - RUNNER_TYPE=scheduler
        healthcheck:
            interval: 30s
            retries: 3
            start_period: 10s
            test: [ "CMD", "pgrep", "-f", "supercronic" ]
            timeout: 5s
        logging:
            driver: journald
        mem_limit: 1024m
        networks:
            - attu
        restart: always
        volumes_from:
            - job-update
        volumes:
            - ./images:/app/mediawiki/images
            - /etc/machine-id:/etc/machine-id:ro
            - /run/log/journal:/run/log/journal:ro
            - /run/systemd/journal/socket:/run/systemd/journal/socket:ro
            - /var/log/journal:/var/log/journal:ro
